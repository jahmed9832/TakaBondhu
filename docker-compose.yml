version: '3.8'

services:
  takabondhu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takabondhu-core
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DEMO_OFFLINE=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
