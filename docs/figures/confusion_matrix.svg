<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" style="background:#0b1329; font-family:system-ui, -apple-system, sans-serif;">
  <text x="40" y="38" fill="#ffffff" font-size="18" font-weight="bold">Confusion Matrix: Multi-Signal Transaction Test Set</text>
  <text x="40" y="58" fill="#94a3b8" font-size="12">Source: ml/reports/results.json • Temporal Split (Days 61–90, N=58,345)</text>

  <!-- Matrix Container -->
  <g transform="translate(140, 100)">
    <!-- Actual Labels -->
    <text x="-40" y="70" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-90 -40 70)">Actual Fraud</text>
    <text x="-40" y="190" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-90 -40 190)">Actual Benign</text>

    <!-- Predicted Labels -->
    <text x="80" y="-15" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="middle">Predicted Fraud</text>
    <text x="240" y="-15" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="middle">Predicted Benign</text>

    <!-- TP Box -->
    <rect x="0" y="10" width="160" height="110" fill="#065f46" stroke="#10b981" stroke-width="2" rx="6" />
    <text x="80" y="55" fill="#ffffff" font-size="22" font-weight="black" text-anchor="middle">1,347</text>
    <text x="80" y="80" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">True Positive (98.32%)</text>

    <!-- FN Box -->
    <rect x="170" y="10" width="160" height="110" fill="#312e81" stroke="#4338ca" stroke-width="1.5" rx="6" />
    <text x="250" y="55" fill="#ffffff" font-size="22" font-weight="black" text-anchor="middle">23</text>
    <text x="250" y="80" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">False Negative (1.68%)</text>

    <!-- FP Box -->
    <rect x="0" y="130" width="160" height="110" fill="#701a75" stroke="#a21caf" stroke-width="1.5" rx="6" />
    <text x="80" y="175" fill="#ffffff" font-size="22" font-weight="black" text-anchor="middle">235</text>
    <text x="80" y="200" fill="#f0abfc" font-size="11" font-weight="600" text-anchor="middle">False Positive (0.41%)</text>

    <!-- TN Box -->
    <rect x="170" y="130" width="160" height="110" fill="#0f172a" stroke="#334155" stroke-width="2" rx="6" />
    <text x="250" y="175" fill="#ffffff" font-size="22" font-weight="black" text-anchor="middle">56,740</text>
    <text x="250" y="200" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">True Negative (99.59%)</text>
  </g>
</svg>